
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 760 500"
     role="img"
     aria-labelledby="title desc">

  <title id="title">
    LaunDrive Laundry Illustration
  </title>

  <desc id="desc">
    Washing machine with folded towels and laundry basket
  </desc>

  <defs>
    <linearGradient id="washer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF9FF"/>
      <stop offset="1" stop-color="#DFD1FA"/>
    </linearGradient>

    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9B73E5"/>
      <stop offset="1" stop-color="#6934BA"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFD8FF"/>
      <stop offset="1" stop-color="#93B5F6"/>
    </linearGradient>

    <linearGradient id="basket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7B880"/>
      <stop offset="1" stop-color="#CC8D60"/>
    </linearGradient>

    <filter id="shadow"
            x="-30%" y="-30%"
            width="160%" height="170%">
      <feDropShadow dx="0" dy="12"
                    stdDeviation="15"
                    flood-color="#5B21B6"
                    flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <path d="M92 369C16 301 72 187 180 177c36-120 159-132
           236-69 69-35 166 5 164 92 122 25 137 155
           39 207H158c-21-11-44-23-66-38Z"
        fill="#D9C8FB"
        opacity=".45"/>

  <path d="M168 396c126-28 334-22 492 2"
        fill="none"
        stroke="#B99CED"
        stroke-width="19"
        stroke-linecap="round"
        opacity=".23"/>

  <!-- SPARKLES -->
  <g fill="#9161D9" opacity=".8">
    <path d="M124 169q0 23-24 27 24 4 24 27
             4-23 27-27-23-4-27-27Z"/>

    <path d="M627 128q0 16-17 20 17 4 17 20
             4-16 21-20-17-4-21-20Z"/>

    <path d="M679 250q0 13-15 17 15 4 15 17
             4-13 18-17-14-4-18-17Z"
          opacity=".65"/>
  </g>

  <!-- FOLDED TOWELS -->
  <g filter="url(#shadow)">
    <rect x="120" y="306"
          width="170" height="43"
          rx="16" fill="#7F5ACB"/>

    <rect x="120" y="307"
          width="72" height="42"
          rx="16" fill="#AD8BE9"/>

    <rect x="134" y="270"
          width="174" height="44"
          rx="16" fill="#F7F2FF"
          stroke="#D4C4F2" stroke-width="3"/>

    <rect x="134" y="271"
          width="80" height="42"
          rx="16" fill="#E1D4FC"/>

    <rect x="111" y="235"
          width="177" height="44"
          rx="16" fill="#B99DEC"/>

    <rect x="111" y="235"
          width="73" height="44"
          rx="16" fill="#D8C6FA"/>
  </g>

  <!-- WASHING MACHINE -->
  <g filter="url(#shadow)">
    <rect x="312" y="90"
          width="267" height="309"
          rx="28" fill="url(#side)"/>

    <rect x="299" y="90"
          width="254" height="305"
          rx="28" fill="url(#washer)"
          stroke="#B8A1EB" stroke-width="5"/>

    <rect x="312" y="105"
          width="228" height="53"
          rx="13" fill="#F5EFFF"/>

    <rect x="326" y="122"
          width="71" height="17"
          rx="8" fill="#BC9EF1"/>

    <circle cx="459" cy="131" r="8" fill="#B99AED"/>
    <circle cx="483" cy="131" r="8" fill="#9D7AE1"/>
    <circle cx="516" cy="131" r="13" fill="#794CC5"/>

    <!-- MACHINE DRUM -->
    <circle cx="428" cy="274" r="108" fill="#7E53C8"/>
    <circle cx="428" cy="274" r="93" fill="#F2EFFF"/>
    <circle cx="428" cy="274" r="78" fill="url(#glass)"/>

    <!-- WATER -->
    <path d="M356 281c22-22 45-24 70-1
             26 25 52 22 80-1v35
             c-17 34-43 42-78 43
             -40 0-62-18-72-43Z"
          fill="#5B8EE4" opacity=".78"/>

    <path d="M372 246c19-17 34-14
             50-1 19 17 46 20 68 2"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="10"
          stroke-linecap="round"
          opacity=".63"/>

    <circle cx="428" cy="274" r="80"
            fill="none"
            stroke="#B9A0F0"
            stroke-width="8"/>

    <!-- MACHINE FEET -->
    <rect x="329" y="383"
          width="35" height="12"
          rx="5" fill="#6035A5"/>

    <rect x="502" y="383"
          width="35" height="12"
          rx="5" fill="#6035A5"/>
  </g>

  <!-- LAUNDRY BASKET -->
  <g filter="url(#shadow)">
    <path d="M550 301h146l-17 91
             c-2 11-12 18-23 18h-65
             c-12 0-21-7-24-18Z"
          fill="url(#basket)"/>

    <path d="M550 301h146l-6 20H556Z"
          fill="#F2C593"/>

    <path d="M578 328v60M607 328v60
             M637 328v60M666 328v60"
          stroke="#B77A57"
          stroke-width="9"
          stroke-linecap="round"
          opacity=".55"/>

    <path d="M552 348h139M557 371h129"
          stroke="#F5D2AA"
          stroke-width="9"
          opacity=".62"/>

    <rect x="542" y="292"
          width="164" height="27"
          rx="13" fill="#E6B17B"/>

    <!-- CLOTHES IN BASKET -->
    <path d="M560 291c6-21 17-35 34-36
             15-1 27 13 32 37
             M615 292c3-25 18-37 32-37
             14 0 28 16 31 37"
          fill="#D9C9F8"
          stroke="#A58AE0"
          stroke-width="4"/>

    <path d="M564 289c-3-19 2-37
             22-39 17-2 25 11 28 39"
          fill="#FFF9FF"/>

    <path d="M620 291c-4-22 4-43
             26-43 16 0 27 16 31 43"
          fill="#8D68D6"/>
  </g>

</svg>
