
<svg xmlns="http://www.w3.org/2000/svg"
     width="200" height="200"
     viewBox="0 0 200 200">

    <defs>
        <linearGradient id="purple"
                        x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6D28D9"/>
            <stop offset="100%" stop-color="#A78BFA"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect x="10" y="10"
          width="180" height="180" rx="38"
          fill="#EDE9FE"/>

    <!-- Delivery speed lines -->
    <path d="M18 72 H53 M12 94 H49 M18 116 H53"
          stroke="#8B5CF6"
          stroke-width="8"
          stroke-linecap="round"/>

    <!-- Washing machine -->
    <rect x="55" y="30"
          width="120" height="140"
          rx="22"
          fill="url(#purple)"/>

    <!-- Machine panel -->
    <rect x="67" y="42"
          width="96" height="116"
          rx="13"
          fill="#FFFFFF"/>

    <!-- Controls -->
    <rect x="75" y="51"
          width="80" height="20"
          rx="7"
          fill="#EDE9FE"/>

    <circle cx="87" cy="61" r="4" fill="#6D28D9"/>
    <circle cx="101" cy="61" r="4" fill="#A78BFA"/>
    <circle cx="143" cy="61" r="4" fill="#6D28D9"/>

    <!-- Washing drum -->
    <circle cx="115" cy="115"
            r="34"
            fill="#F5F3FF"
            stroke="#6D28D9"
            stroke-width="8"/>

    <!-- Water wave -->
    <path d="M90 117
             Q103 105 115 117
             T140 117"
          fill="none"
          stroke="#A78BFA"
          stroke-width="7"
          stroke-linecap="round"/>

</svg>
